<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>My Tickets | Namo Bharat</title>


<link rel="stylesheet" href="css/style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>


body{

background:#f5f8fc;

font-family:Arial,sans-serif;

}



.ticket-page{

min-height:100vh;

padding:40px;

}



.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}



.header h1{

font-size:32px;

color:#14213d;

}



.header span{

color:#006cff;

}



.back-btn{

background:#006cff;

color:white;

padding:12px 20px;

border-radius:12px;

text-decoration:none;

}







.ticket-card{


background:white;

padding:30px;

border-radius:25px;

box-shadow:

0 15px 40px rgba(0,0,0,.08);

margin-bottom:25px;


}




.ticket-top{


display:flex;

justify-content:space-between;

align-items:center;


}




.train{


display:flex;

gap:15px;

align-items:center;


}




.train-icon{


width:60px;

height:60px;

border-radius:18px;

background:#eaf3ff;

color:#006cff;

display:flex;

justify-content:center;

align-items:center;

font-size:28px;


}





.status{


background:#d9ffe8;

color:#00a651;

padding:8px 18px;

border-radius:20px;

font-weight:bold;


}





.route{


display:flex;

justify-content:space-around;

align-items:center;

margin-top:25px;

text-align:center;


}




.route h2{


color:#006cff;

}



.arrow{

font-size:30px;

color:#777;

}






.details{


margin-top:25px;

background:#f7fbff;

padding:20px;

border-radius:15px;


}



.row{


display:flex;

justify-content:space-between;

padding:10px 0;


}



.row span{

color:#666;

}





.buttons{


display:flex;

gap:15px;

margin-top:25px;


}




.buttons button{


flex:1;

height:45px;

border:none;

border-radius:12px;

font-weight:bold;

cursor:pointer;


}




.qr{

background:#006cff;

color:white;

}



.cancel{

background:#ffe4e4;

color:#ff4757;

}




.empty{


text-align:center;

background:white;

padding:40px;

border-radius:20px;

}



@media(max-width:700px){


.ticket-top{

flex-direction:column;

gap:20px;

}



.route{

flex-direction:column;

gap:15px;

}


}



</style>


</head>



<body>




<div class="ticket-page">





<div class="header">


<div>


<h1>

My <span>Tickets</span> 🎟️

</h1>


<p>

Your Namo Bharat booking history

</p>


</div>



<a href="dashboard.html"
class="back-btn">

Dashboard

</a>



</div>









<!-- Ticket 1 -->



<div class="ticket-card">





<div class="ticket-top">



<div class="train">


<div class="train-icon">

<i class="fa-solid fa-train"></i>

</div>



<div>

<h2>

</h2>


<p>

</p>


</div>


</div>

</div>



</div>







<div class="route">



<div>

<p>

FROM

</p>


<h2>

Delhi

</h2>


</div>





<div class="arrow">

→

</div>




<div>

<p>

TO

</p>


<h2>

Meerut

</h2>


</div>




</div>







<div class="details">


<div class="row">

<strong>

Date

</strong>

<span>

10 August 2026

</span>


</div>





<div class="row">

<strong>

Time

</strong>

<span>

09:30 AM

</span>


</div>





<div class="row">

<strong>

Fare

</strong>

<span>

₹80

</span>


</div>




</div>







<div class="buttons">


<button class="qr"
onclick="openQR()">


<i class="fa-solid fa-qrcode"></i>

View QR Ticket


</button>





<button class="cancel"
onclick="cancelTicket()">


<i class="fa-solid fa-xmark"></i>

Cancel


</button>



</div>





</div>









<!-- Ticket 2 -->



<div class="ticket-card">





<div class="ticket-top">



<div class="train">


<div class="train-icon">

<i class="fa-solid fa-train"></i>

</div>



<div>

<div>

<p>

<h2>

Ghaziabad

</div>




</div>







<div class="details">


<div class="row">

Fare

</strong>

<span>

₹40

</span>


</div>


</div>







</div>









<script>


function openQR(){


window.location.href=

"qr-ticket.html";


}





function cancelTicket(){


alert(

"Ticket Cancellation Request Submitted"

);


}



</script>





</body>

</html>
