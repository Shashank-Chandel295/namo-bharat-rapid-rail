<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>Booking Confirmed | Namo Bharat</title>


<link rel="stylesheet" href="css/style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



<style>


body{

font-family:Arial,sans-serif;

background:#f5f8fc;

}



.confirm-page{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}





.confirm-card{


background:white;

width:600px;

padding:40px;

border-radius:25px;

text-align:center;

box-shadow:

0 20px 50px rgba(0,0,0,.08);


}





.success-icon{


width:90px;

height:90px;

background:#d9ffe8;

color:#00a651;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

font-size:45px;

margin:auto;


}





.confirm-card h1{


margin-top:25px;

color:#14213d;


}



.confirm-card h1 span{


color:#00a651;


}





.ticket-box{


margin-top:35px;

background:#f7fbff;

border-radius:20px;

padding:25px;

text-align:left;


}





.ticket-row{


display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px dashed #ddd;


}



.ticket-row:last-child{

border:none;

}



.ticket-row span{


color:#777;


}





.ticket-id{


background:#006cff;

color:white;

padding:10px 20px;

border-radius:20px;

display:inline-block;

margin-top:20px;

font-weight:bold;


}





.qr-btn{


width:100%;

height:50px;

margin-top:30px;

border:none;

border-radius:12px;

background:#006cff;

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;


}




.home-btn{


display:block;

margin-top:15px;

text-decoration:none;

color:#006cff;

font-weight:600;


}



.train-animation{


font-size:80px;

color:#006cff;

margin-top:25px;


animation:moveTrain 2s infinite alternate;


}




@keyframes moveTrain{


from{

transform:translateX(-20px);

}


to{

transform:translateX(20px);

}


}





@media(max-width:650px){


.confirm-card{

width:100%;

padding:25px;

}


}


</style>


</head>



<body>




<div class="confirm-page">





<div class="confirm-card">





<div class="success-icon">

<i class="fa-solid fa-check"></i>

</div>






<h1>

Booking <span>Successful</span> 🎉

</h1>



<p>

Your Namo Bharat journey has been confirmed.

</p>








<div class="ticket-id">

Ticket ID:

<span id="ticketId">

NBR458921

</span>

</div>









<div class="ticket-box">



<div class="ticket-row">

<strong>

Passenger

</strong>

<span>

Shashank

</span>


</div>





<div class="ticket-row">

<strong>

Route

</strong>

<span>

Delhi → Meerut

</span>


</div>






<div class="ticket-row">

<strong>

Train

</strong>

<span>

Namo Bharat Express

</span>


</div>







<div class="ticket-row">

<strong>

Date

</strong>

<span>

10 August 2026

</span>


</div>







<div class="ticket-row">

<strong>

Time

</strong>

<span>

09:30 AM

</span>


</div>







<div class="ticket-row">

<strong>

Class

</strong>

<span>

Premium

</span>


</div>







<div class="ticket-row">

<strong>

Fare

</strong>

<span>

₹80

</span>


</div>






</div>









<button class="qr-btn"
onclick="generateQR()">


<i class="fa-solid fa-qrcode"></i>

Generate QR Ticket


</button>







<a href="dashboard.html"
class="home-btn">


Go To Dashboard


</a>







<div class="train-animation">


<i class="fa-solid fa-train"></i>


</div>






</div>






</div>







<script>


// Generate Random Ticket ID


let randomID =
"NBR" +
Math.floor(
Math.random()*900000+100000
);



document
.getElementById("ticketId")
.innerHTML=randomID;







function generateQR(){


alert(
"QR Ticket Generated Successfully!"
);



}



</script>



</body>

</html>
