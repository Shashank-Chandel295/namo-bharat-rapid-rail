
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Change Password | Namo Bharat
    </title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef5ff,
                    #f8fbff
                );

        }


        .password-page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .password-card {

            width: 480px;

            max-width: 100%;

            background: white;

            border-radius: 25px;

            padding: 35px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.10);

        }


        /* HEADER */

        .password-header {

            text-align: center;

            margin-bottom: 30px;

        }


        .password-icon {

            width: 75px;

            height: 75px;

            margin: auto;

            border-radius: 20px;

            background: #eaf3ff;

            color: #006cff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

        }


        .password-header h1 {

            margin: 18px 0 8px;

            color: #14213d;

            font-size: 27px;

        }


        .password-header p {

            margin: 0;

            color: #777;

            font-size: 14px;

        }


        /* INPUT */

        .input-box {

            margin-bottom: 20px;

        }


        .input-box label {

            display: block;

            margin-bottom: 8px;

            color: #444;

            font-size: 13px;

            font-weight: bold;

        }


        .password-input {

            position: relative;

        }


        .password-input input {

            width: 100%;

            height: 50px;

            padding:
                0 48px 0 15px;

            border: 1px solid #ddd;

            border-radius: 12px;

            outline: none;

            font-size: 14px;

        }


        .password-input input:focus {

            border-color: #006cff;

        }


        .show-password {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #777;

            cursor: pointer;

            font-size: 16px;

        }


        /* PASSWORD RULES */

        .password-rules {

            background: #f5f9ff;

            border-radius: 13px;

            padding: 15px;

            margin-bottom: 22px;

        }


        .password-rules p {

            margin: 5px 0;

            font-size: 12px;

            color: #777;

        }


        .password-rules i {

            color: #00a651;

            margin-right: 7px;

        }


        /* BUTTON */

        .update-btn {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #006cff,
                    #00b7ff
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        .update-btn:hover {

            opacity: .9;

        }


        /* BACK */

        .back-profile {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #006cff;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

        }


        .message {

            display: none;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 13px;

            font-weight: bold;

        }


        .success {

            background: #e7f8ef;

            color: #008a43;

        }


        .error {

            background: #fff0f0;

            color: #d93025;

        }


        @media(max-width:500px) {

            .password-card {

                padding: 25px 20px;

            }

        }

    </style>

</head>


<body>


<div class="password-page">


    <div class="password-card">


        <!-- HEADER -->

        <div class="password-header">


            <div class="password-icon">

                <i class="fa-solid fa-lock"></i>

            </div>


            <h1>
                Change Password
            </h1>


            <p>
                Create a new password for your
                Namo Bharat account.
            </p>


        </div>



        <!-- MESSAGE -->

        <div
            id="message"
            class="message">

        </div>



        <!-- CURRENT PASSWORD -->

        <div class="input-box">

            <label>
                Current Password
            </label>


            <div class="password-input">

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="Enter current password">


                <button
                    class="show-password"
                    onclick="togglePassword(
                        'currentPassword',
                        this
                    )">

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>



        <!-- NEW PASSWORD -->

        <div class="input-box">

            <label>
                New Password
            </label>


            <div class="password-input">

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password">


                <button
                    class="show-password"
                    onclick="togglePassword(
                        'newPassword',
                        this
                    )">

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>



        <!-- CONFIRM PASSWORD -->

        <div class="input-box">

            <label>
                Confirm New Password
            </label>


            <div class="password-input">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password">


                <button
                    class="show-password"
                    onclick="togglePassword(
                        'confirmPassword',
                        this
                    )">

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>



        <!-- RULES -->

        <div class="password-rules">

            <p>
                <i class="fa-solid fa-check"></i>
                Minimum 6 characters
            </p>

            <p>
                <i class="fa-solid fa-check"></i>
                New passwords must match
            </p>

        </div>



        <!-- UPDATE -->

        <button
            class="update-btn"
            onclick="updatePassword()">

            <i class="fa-solid fa-key"></i>

            Update Password

        </button>



        <!-- BACK -->

        <a
            href="profile.html"
            class="back-profile">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Profile

        </a>


    </div>

</div>



<script>


// ========================================
// SHOW / HIDE PASSWORD
// ========================================


function togglePassword(
    inputId,
    button
) {


    let input =
        document.getElementById(inputId);


    let icon =
        button.querySelector("i");


    if (
        input.type === "password"
    ) {

        input.type = "text";

        icon.classList.remove(
            "fa-eye"
        );

        icon.classList.add(
            "fa-eye-slash"
        );

    }

    else {

        input.type = "password";

        icon.classList.remove(
            "fa-eye-slash"
        );

        icon.classList.add(
            "fa-eye"
        );

    }

}



// ========================================
// MESSAGE
// ========================================


function showMessage(
    text,
    type
) {


    let message =
        document.getElementById("message");


    message.innerText = text;


    message.className =
        "message " + type;


    message.style.display =
        "block";

}



// ========================================
// UPDATE PASSWORD
// ========================================


function updatePassword() {


    let current =
        document.getElementById(
            "currentPassword"
        ).value;


    let newPassword =
        document.getElementById(
            "newPassword"
        ).value;


    let confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;



    // EMPTY CHECK

    if (
        current === "" ||
        newPassword === "" ||
        confirmPassword === ""
    ) {

        showMessage(
            "Please fill all fields.",
            "error"
        );

        return;

    }



    // CURRENT PASSWORD

    let savedPassword =
        localStorage.getItem(
            "namoUserPassword"
        );



    /*
       Demo account ke liye agar
       password pehle save nahi hai
       to current password = 123456
    */

    if (!savedPassword) {

        savedPassword = "123456";

    }



    if (
        current !== savedPassword
    ) {

        showMessage(
            "Current password is incorrect.",
            "error"
        );

        return;

    }



    // LENGTH

    if (
        newPassword.length < 6
    ) {

        showMessage(
            "New password must contain at least 6 characters.",
            "error"
        );

        return;

    }



    // MATCH

    if (
        newPassword !== confirmPassword
    ) {

        showMessage(
            "New passwords do not match.",
            "error"
        );

        return;

    }



    // SAVE

    localStorage.setItem(
        "namoUserPassword",
        newPassword
    );



    showMessage(
        "Password changed successfully! ✅",
        "success"
    );



    // CLEAR

    document.getElementById(
        "currentPassword"
    ).value = "";


    document.getElementById(
        "newPassword"
    ).value = "";


    document.getElementById(
        "confirmPassword"
    ).value = "";


}



// ========================================
// END
// ========================================

</script>


</body>

</html>
