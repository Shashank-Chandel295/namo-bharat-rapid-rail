<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>QR Ticket | Namo Bharat</title>


<link rel="stylesheet" href="css/style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<!-- QR CODE LIBRARY -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>



<style>


body{

background:#f5f8fc;

font-family:Arial,sans-serif;

}



.qr-page{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}



.qr-card{

width:600px;

background:white;

padding:40px;

border-radius:25px;

text-align:center;

box-shadow:

0 20px 50px rgba(0,0,0,.08);

}



.train-logo{

width:80px;

height:80px;

margin:auto;

background:#eaf3ff;

color:#006cff;

border-radius:20px;

display:flex;

align-items:center;

justify-content:center;

font-size:35px;

}




h1{

margin-top:20px;

}



h1 span{

color:#006cff;

}



.ticket-info{


margin-top:30px;

background:#f7fbff;

padding:20px;

border-radius:15px;

text-align:left;

}



.row{

display:flex;

justify-content:space-between;

padding:10px 0;

border-bottom:1px dashed #ddd;

}



.row:last-child{

border:none;

}



.row span{

color:#666;

}





#qrcode{

margin:30px auto;

width:max-content;

padding:15px;

background:white;

border-radius:15px;

box-shadow:

0 10px 25px rgba(0,0,0,.1);

}




.download-btn{


width:100%;

height:50px;

border:none;

border-radius:12px;

background:#006cff;

color:white;

font-weight:bold;

cursor:pointer;

}



.back-btn{


display:block;

margin-top:15px;

color:#006cff;

text-decoration:none;

font-weight:bold;

}



</style>


</head>



<body>



<div class="qr-page">



<div class="qr-card">



<div class="train-logo">

<i class="fa-solid fa-train"></i>

</div>





<h1>

Namo Bharat

<span>

QR Ticket

</span>

</h1>



<p>

Scan this QR at entry gate

</p>







<div class="ticket-info">


<div class="row">

<strong>

Ticket ID

</strong>

<span id="ticketId">

NBR123456

</span>


</div>





<div class="row">

<strong>

Passenger

</strong>

<span>

Shashank

</span>


</div>






<div class="row">

<strong>

Route

</strong>

<span>

Delhi → Meerut

</span>


</div>






<div class="row">

<strong>

Fare

</strong>

<span>

₹80

</span>


</div>



</div>








<div id="qrcode"></div>






<button class="download-btn"
onclick="downloadQR()">



<i class="fa-solid fa-download"></i>

Download QR Ticket


</button>







<a href="dashboard.html"
class="back-btn">


Back To Dashboard


</a>




</div>


</div>







<script>


let ticketID =

"NBR" +

Math.floor(
Math.random()*900000+100000
);



document
.getElementById("ticketId")
.innerHTML=ticketID;





let qrData =

`

NAMO BHARAT TICKET

Ticket ID:
${ticketID}

Passenger:
Shashank

Route:
Delhi To Meerut

Fare:
₹80

Status:
CONFIRMED

`;





let qr = new QRCode(

document.getElementById("qrcode"),

{

text:qrData,

width:200,

height:200

}

);








function downloadQR(){


let img =
document.querySelector("#qrcode img");


let link =
document.createElement("a");


link.href =
img.src;


link.download =
"Namo-Bharat-QR-Ticket.png";


link.click();



}


</script>




</body>

</html>
