<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Payment Receipt | Namo Bharat</title>


<link rel="stylesheet" href="css/style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>


body{

background:#f5f8fc;

font-family:Arial,sans-serif;

}



.receipt-page{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}



.receipt-card{

width:600px;

background:white;

padding:40px;

border-radius:25px;

box-shadow:

0 20px 50px rgba(0,0,0,.08);

text-align:center;

}



.success-icon{

width:90px;

height:90px;

background:#d9ffe8;

color:#00a651;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

font-size:45px;

margin:auto;


}




.receipt-card h1{

margin-top:25px;

color:#14213d;

}



.receipt-card h1 span{

color:#00a651;

}




.amount{


margin-top:25px;

font-size:35px;

font-weight:700;

color:#006cff;


}




.receipt-box{


margin-top:35px;

background:#f7fbff;

padding:25px;

border-radius:20px;

text-align:left;


}



.row{


display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px dashed #ddd;


}



.row:last-child{

border:none;

}



.row span{

color:#777;

}



.transaction{


margin-top:25px;

background:#006cff;

color:white;

padding:12px 20px;

border-radius:20px;

display:inline-block;

font-weight:bold;


}





.buttons{


display:flex;

gap:15px;

margin-top:30px;


}




.buttons button{


flex:1;

height:50px;

border:none;

border-radius:12px;

cursor:pointer;

font-weight:bold;


}



.download{

background:#006cff;

color:white;

}



.dashboard-btn{

background:#eaf3ff;

color:#006cff;

}




</style>


</head>



<body>




<div class="receipt-page">





<div class="receipt-card">





<div class="success-icon">

<i class="fa-solid fa-check"></i>

</div>






<h1>

Payment <span>Successful</span> 🎉

</h1>


<p>

Your Namo Bharat ticket payment has been completed.

</p>







<div class="amount">

₹80

</div>









<div class="transaction">

Transaction ID:

<span id="transactionId">

TXN123456

</span>

</div>








<div class="receipt-box">



<div class="row">

<strong>

Payment Method

</strong>


<span>

UPI

</span>


</div>





<div class="row">

<strong>

Passenger

</strong>


<span>

Shashank

</span>


</div>







<div class="row">

<strong>

Ticket

</strong>


<span>

Delhi → Meerut

</span>


</div>






<div class="row">

<strong>

Train

</strong>


<span>

Namo Bharat Express

</span>


</div>






<div class="row">

<strong>

Date

</strong>


<span>

10 August 2026

</span>


</div>






<div class="row">

<strong>

Status

</strong>


<span>

Paid ✅

</span>


</div>





</div>










<div class="buttons">


<button class="download"
onclick="downloadReceipt()">


<i class="fa-solid fa-download"></i>

Download Receipt


</button>





<button class="dashboard-btn"
onclick="goDashboard()">



Dashboard


</button>



</div>







</div>






</div>







<script>


let txn =

"TXN" +

Math.floor(
Math.random()*900000+100000
);



document
.getElementById("transactionId")
.innerHTML=txn;







function downloadReceipt(){


alert(
"Receipt Download Started"
);


}







function goDashboard(){


window.location.href=
"dashboard.html";


}



</script>




</body>

</html>
