
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Digital Ticket | Namo Bharat</title>


    <link rel="stylesheet" href="css/style.css">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- QR CODE LIBRARY -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>


    <style>

        body {

            background: #f4f8fc;

            font-family: Arial, sans-serif;

        }


        .ticket-page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }


        .ticket-card {

            width: 650px;

            background: white;

            border-radius: 25px;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(0,0,0,.1);

        }


        .ticket-header {

            background:
                linear-gradient(
                    135deg,
                    #006cff,
                    #00b7ff
                );

            color: white;

            padding: 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .ticket-header h1 {

            font-size: 25px;

            margin-bottom: 5px;

        }


        .ticket-header p {

            margin: 0;

            opacity: .9;

        }


        .ticket-header i {

            font-size: 45px;

        }


        .ticket-body {

            padding: 35px;

        }


        .success {

            text-align: center;

            color: #00a651;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 25px;

        }


        .route {

            display: flex;

            justify-content: space-around;

            align-items: center;

            text-align: center;

        }


        .route h2 {

            color: #006cff;

            font-size: 25px;

            margin: 5px 0;

        }


        .route p {

            margin: 0;

            color: #777;

            font-size: 12px;

            font-weight: bold;

        }


        .route i {

            font-size: 30px;

            color: #777;

        }


        .details {

            margin-top: 35px;

            border-top: 1px dashed #ddd;

            padding-top: 25px;

        }


        .row {

            display: flex;

            justify-content: space-between;

            padding: 12px 0;

        }


        .row span {

            color: #777;

        }


        .qr-section {

            margin-top: 30px;

            background: #f3f8ff;

            padding: 25px;

            border-radius: 15px;

            text-align: center;

        }


        .qr-section h3 {

            margin-top: 0;

            color: #14213d;

        }


        .qr-code {

            width: 180px;

            height: 180px;

            margin: 20px auto 0;

            background: white;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 10px;

            box-sizing: border-box;

        }


        .qr-code img {

            width: 160px !important;

            height: 160px !important;

        }


        .qr-note {

            margin-top: 15px;

            font-size: 12px;

            color: #777;

        }


        .action-buttons {

            display: flex;

            gap: 15px;

            margin-top: 30px;

        }


        .action-buttons button {

            flex: 1;

            height: 50px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;

        }


        .download {

            background: #006cff;

            color: white;

        }


        .print {

            background: #eaf3ff;

            color: #006cff;

        }


        .dashboard {

            background: #f1f1f1;

            color: #333;

        }


        @media(max-width:700px) {

            .ticket-page {

                padding: 15px;

            }


            .ticket-card {

                width: 100%;

            }


            .ticket-body {

                padding: 25px 20px;

            }


            .route {

                gap: 10px;

            }


            .route h2 {

                font-size: 19px;

            }


            .action-buttons {

                flex-direction: column;

            }

        }


        /* PRINT DESIGN */

        @media print {

            body {

                background: white;

            }


            .ticket-page {

                padding: 0;

            }


            .ticket-card {

                width: 100%;

                box-shadow: none;

            }


            .action-buttons {

                display: none;

            }

        }

    </style>

</head>


<body>


<div class="ticket-page">


    <div class="ticket-card">


        <!-- HEADER -->

        <div class="ticket-header">

            <div>

                <h1>
                    NAMO BHARAT
                </h1>

                <p>
                    Digital Travel Ticket
                </p>

            </div>


            <i class="fa-solid fa-train"></i>

        </div>



        <div class="ticket-body">


            <!-- SUCCESS -->

            <div class="success">

                ✓ Booking Confirmed

            </div>



            <!-- ROUTE -->

            <div class="route">


                <div>

                    <p>
                        FROM
                    </p>

                    <h2 id="ticket-from">
                        Delhi
                    </h2>

                </div>



                <i class="fa-solid fa-arrow-right"></i>



                <div>

                    <p>
                        TO
                    </p>

                    <h2 id="ticket-to">
                        Meerut
                    </h2>

                </div>


            </div>



            <!-- DETAILS -->

            <div class="details">


                <div class="row">

                    <strong>
                        Passenger
                    </strong>

                    <span id="ticket-passenger">
                        Shashank
                    </span>

                </div>



                <div class="row">

                    <strong>
                        Train
                    </strong>

                    <span>
                        Namo Bharat Express
                    </span>

                </div>



                <div class="row">

                    <strong>
                        Date
                    </strong>

                    <span id="ticket-date">
                        10 August 2026
                    </span>

                </div>



                <div class="row">

                    <strong>
                        Time
                    </strong>

                    <span>
                        09:30 AM
                    </span>

                </div>



                <div class="row">

                    <strong>
                        Class
                    </strong>

                    <span id="ticket-class">
                        Premium
                    </span>

                </div>



                <div class="row">

                    <strong>
                        Passengers
                    </strong>

                    <span id="ticket-passengers">
                        1
                    </span>

                </div>



                <div class="row">

                    <strong>
                        Fare
                    </strong>

                    <span id="ticket-fare">
                        ₹80
                    </span>

                </div>



                <div class="row">

                    <strong>
                        Ticket ID
                    </strong>

                    <span id="ticketId">
                        NBR123456
                    </span>

                </div>


            </div>



            <!-- QR -->

            <div class="qr-section">

                <h3>
                    Scan QR At Entry Gate
                </h3>


                <div
                    id="qrcode"
                    class="qr-code">
                </div>


                <p class="qr-note">

                    Scan this QR code to verify
                    your Namo Bharat ticket.

                </p>

            </div>



            <!-- BUTTONS -->

            <div class="action-buttons">


                <button
                    class="download"
                    onclick="downloadTicket()">

                    <i class="fa-solid fa-download"></i>

                    Download

                </button>



                <button
                    class="print"
                    onclick="printTicket()">

                    <i class="fa-solid fa-print"></i>

                    Print

                </button>



                <button
                    class="dashboard"
                    onclick="goDashboard()">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </button>


            </div>


        </div>

    </div>

</div>



<script>


// ========================================
// GET USER DATA
// ========================================


let passengerName =
    localStorage.getItem("namoUserName");


let fromStation =
    localStorage.getItem("bookingFrom");


let toStation =
    localStorage.getItem("bookingTo");


let journeyDate =
    localStorage.getItem("bookingDate");


let passengers =
    localStorage.getItem("bookingPassengers");


let travelClass =
    localStorage.getItem("bookingClass");


let fare =
    localStorage.getItem("bookingFare");



// ========================================
// TICKET ID
// ========================================


let ticketId =
    localStorage.getItem("ticketId");


if (!ticketId) {

    ticketId =
        "NBR" +
        Math.floor(
            Math.random() * 900000 + 100000
        );

    localStorage.setItem(
        "ticketId",
        ticketId
    );

}


document.getElementById("ticketId")
    .innerText = ticketId;



// ========================================
// DISPLAY DATA
// ========================================


if (passengerName) {

    document.getElementById("ticket-passenger")
        .innerText = passengerName;

}


if (fromStation) {

    document.getElementById("ticket-from")
        .innerText = fromStation;

}


if (toStation) {

    document.getElementById("ticket-to")
        .innerText = toStation;

}


if (journeyDate) {

    document.getElementById("ticket-date")
        .innerText = journeyDate;

}


if (passengers) {

    document.getElementById("ticket-passengers")
        .innerText = passengers;

}


if (travelClass) {

    document.getElementById("ticket-class")
        .innerText = travelClass;

}


if (fare) {

    document.getElementById("ticket-fare")
        .innerText = "₹" + fare;

}



// ========================================
// QR CODE DATA
// ========================================


let qrData =

    "NAMO BHARAT RAPID RAIL" +

    "\nTicket ID: " +
    (ticketId || "NBR000000") +

    "\nPassenger: " +
    (passengerName || "Passenger") +

    "\nFrom: " +
    (fromStation || "Unknown") +

    "\nTo: " +
    (toStation || "Unknown") +

    "\nDate: " +
    (journeyDate || "Unknown") +

    "\nPassengers: " +
    (passengers || "1") +

    "\nClass: " +
    (travelClass || "Standard") +

    "\nFare: ₹" +
    (fare || "0");



// ========================================
// GENERATE REAL QR CODE
// ========================================


new QRCode(

    document.getElementById("qrcode"),

    {

        text: qrData,

        width: 160,

        height: 160,

        colorDark: "#111111",

        colorLight: "#ffffff",

        correctLevel:
            QRCode.CorrectLevel.H

    }

);



// ========================================
// DOWNLOAD
// ========================================


function downloadTicket() {

    alert(
        "Ticket download feature will be connected in the next step."
    );

}



// ========================================
// PRINT
// ========================================


function printTicket() {

    window.print();

}



// ========================================
// DASHBOARD
// ========================================


function goDashboard() {

    window.location.href =
        "dashboard.html";

}


</script>


</body>

</html>
