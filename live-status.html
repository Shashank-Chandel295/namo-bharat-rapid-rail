<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Live Train Status | Namo Bharat</title>


<link rel="stylesheet" href="css/style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>


body{

background:#f5f8fc;

font-family:Arial,sans-serif;

}



.status-page{

min-height:100vh;

padding:40px;

}



.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}



.header h1{

font-size:32px;

color:#14213d;

}



.header span{

color:#006cff;

}



.back-btn{

background:#006cff;

color:white;

padding:12px 20px;

border-radius:12px;

text-decoration:none;

}





.search-box{


background:white;

padding:25px;

border-radius:20px;

box-shadow:
0 10px 30px rgba(0,0,0,.07);

display:flex;

gap:15px;

margin-bottom:30px;


}




.search-box input{


flex:1;

height:50px;

border:1px solid #ddd;

border-radius:12px;

padding:0 15px;

font-size:15px;


}




.search-box button{


background:#006cff;

color:white;

border:none;

border-radius:12px;

padding:0 25px;

font-weight:bold;

cursor:pointer;


}







.status-card{


background:white;

padding:35px;

border-radius:25px;

box-shadow:

0 15px 40px rgba(0,0,0,.08);


}







.train-title{


display:flex;

align-items:center;

gap:15px;


}



.train-icon{


width:60px;

height:60px;

background:#eaf3ff;

color:#006cff;

border-radius:18px;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

}



.running{


margin-left:auto;

background:#d9ffe8;

color:#00a651;

padding:10px 20px;

border-radius:20px;

font-weight:bold;

}





.location-box{


display:grid;

grid-template-columns:1fr 1fr;

gap:25px;

margin-top:35px;


}





.info{


background:#f7fbff;

padding:25px;

border-radius:18px;


}



.info h3{

color:#006cff;

margin-bottom:10px;

}





.route-line{


margin-top:35px;

}



.progress{


height:10px;

background:#ddd;

border-radius:20px;

overflow:hidden;


}



.progress span{


display:block;

height:100%;

width:75%;

background:#006cff;


}





.station-row{


display:flex;

justify-content:space-between;

margin-top:15px;

color:#555;


}







@media(max-width:700px){


.search-box{

flex-direction:column;

}


.location-box{

grid-template-columns:1fr;

}


.header{

flex-direction:column;

gap:20px;

align-items:flex-start;

}


}


</style>


</head>



<body>



<div class="status-page">





<div class="header">


<div>

<h1>

Live <span>Train Status</span> 🚆

</h1>


<p>

Track your Namo Bharat journey

</p>


</div>




<a href="dashboard.html"
class="back-btn">

Dashboard

</a>



</div>








<div class="search-box">


<input

type="text"

placeholder="Enter Train Number (Example: NBR101)">



<button onclick="showStatus()">

Search

</button>



</div>








<div class="status-card">





<div class="train-title">



<div class="train-icon">

<i class="fa-solid fa-train"></i>

</div>




<div>

<h2>

Namo Bharat Express

</h2>


<p>

Train No: NBR101

</p>


</div>






<div class="running">

🟢 Running On Time

</div>



</div>









<div class="location-box">



<div class="info">


<h3>

Current Location

</h3>


<h2>

Ghaziabad

</h2>


<p>

Passed 10 minutes ago

</p>


</div>







<div class="info">


<h3>

Next Station

</h3>


<h2>

Meerut

</h2>


<p>

Arrival: 10:15 AM

</p>


</div>




</div>







<div class="route-line">


<h3>

Journey Progress

</h3>


<br>


<div class="progress">

<span></span>

</div>



<div class="station-row">


<span>

Delhi

</span>



<span>

Ghaziabad

</span>



<span>

Meerut

</span>


</div>


</div>






</div>






</div>







<script>


function showStatus(){


alert(
"Live Status Updated Successfully 🚆"
);


}



</script>



</body>

</html>
