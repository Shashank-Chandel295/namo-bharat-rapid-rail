<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Fare Calculator | Namo Bharat</title>


<link rel="stylesheet" href="css/style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



<style>


body{

background:#f5f8fc;

font-family:Arial,sans-serif;

}



.fare-page{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}



.fare-card{


width:650px;

background:white;

padding:40px;

border-radius:25px;

box-shadow:

0 20px 50px rgba(0,0,0,.08);


}




.header{


text-align:center;

}



.header i{


font-size:50px;

color:#006cff;


}



.header h1{


margin-top:15px;

color:#14213d;


}



.header span{

color:#006cff;

}





.form-group{


margin-top:25px;


}



.form-group label{


font-weight:600;


}




select,
input{


width:100%;

height:50px;

margin-top:8px;

border:1px solid #ddd;

border-radius:12px;

padding:0 15px;

font-size:15px;


}






.class-box{


display:flex;

gap:15px;

margin-top:20px;


}



.class-option{


flex:1;

padding:20px;

border:2px solid #ddd;

border-radius:15px;

cursor:pointer;


}



.class-option:hover{


border-color:#006cff;

background:#f3f8ff;


}






.result-box{


margin-top:30px;

background:#eaf3ff;

padding:25px;

border-radius:20px;


}



.result-row{


display:flex;

justify-content:space-between;

padding:10px 0;


}




.result-row span{


color:#555;


}






.calculate-btn{


width:100%;

height:55px;

margin-top:30px;

border:none;

border-radius:15px;

background:#006cff;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;


}





</style>


</head>



<body>




<div class="fare-page">





<div class="fare-card">






<div class="header">


<i class="fa-solid fa-calculator"></i>


<h1>

Fare <span>Calculator</span>

</h1>


<p>

Calculate your Namo Bharat ticket fare

</p>


</div>








<div class="form-group">


<label>

From Station

</label>


<select id="from">


<option value="20">

New Ashok Nagar

</option>


<option value="30">

Anand Vihar

</option>


<option value="40">

Sahibabad

</option>


<option value="50">

Ghaziabad

</option>


</select>



</div>









<div class="form-group">


<label>

To Station

</label>


<select id="to">


<option value="50">

Meerut

</option>


<option value="40">

Ghaziabad

</option>


<option value="30">

Sahibabad

</option>


<option value="20">

Anand Vihar

</option>


</select>


</div>









<div class="form-group">


<label>

Passengers

</label>


<input type="number"

id="passenger"

value="1"

min="1">


</div>









<div class="form-group">


<label>

Select Class

</label>



<div class="class-box">


<label class="class-option">


<input type="radio"

name="class"

value="1"

checked>


Standard

<br>

Base Fare


</label>





<label class="class-option">


<input type="radio"

name="class"

value="2">


Premium

<br>

2x Fare


</label>



</div>


</div>









<div class="result-box">


<div class="result-row">


<strong>

Distance

</strong>


<span id="distance">

0 KM

</span>


</div>





<div class="result-row">


<strong>

Total Fare

</strong>


<span id="fare">

₹0

</span>


</div>




</div>







<button class="calculate-btn"
onclick="calculateFare()">



Calculate Fare


</button>







</div>




</div>








<script>


function calculateFare(){



let from =

Number(
document.getElementById("from").value
);



let to =

Number(
document.getElementById("to").value
);




let passenger =

Number(
document.getElementById("passenger").value
);



let classType =

Number(
document.querySelector(
'input[name="class"]:checked'
).value
);




let distance =

Math.abs(to-from)*2 + 20;



let fare =

distance * 1.5;



fare =

fare * classType * passenger;





if(passenger >=3){


fare = fare - (fare*10/100);


}



document
.getElementById("distance")
.innerHTML =
distance+" KM";





document
.getElementById("fare")
.innerHTML =
"₹"+fare;



}



</script>





</body>

</html>
