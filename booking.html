<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Ticket | Namo Bharat</title>

<link rel="stylesheet" href="CSS/style.css">
<link rel="stylesheet" href="CSS/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.booking-page {
    min-height: 100vh;
    background: #f5f8fc;
    padding: 40px;
}

.booking-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.booking-header h1 {
    font-size: 32px;
    color: #14213d;
}

.booking-header span {
    color: #006cff;
}


/* ================= DASHBOARD BUTTON ================= */

.back-dashboard {
    text-decoration: none;
    background: #006cff;
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}


/* ================= BOOKING CONTAINER ================= */

.booking-container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,.08);
}


/* ================= TITLE ================= */

.booking-title {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
}

.booking-title i {
    width: 55px;
    height: 55px;
    border-radius: 15px;
    background: #eaf3ff;
    color: #006cff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
}


/* ================= FORM ================= */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.input-box label {
    font-weight: 600;
    font-size: 14px;
}

.input-box input,
.input-box select {
    width: 100%;
    height: 50px;
    margin-top: 8px;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 0 15px;
    outline: none;
    font-size: 14px;
}

.input-box input:focus,
.input-box select:focus {
    border-color: #006cff;
}


/* ================= CLASS ================= */

.class-box {
    margin-top: 30px;
}

.class-options {
    display: flex;
    gap: 20px;
    margin-top: 15px;
}

.class-card {
    flex: 1;
    border: 2px solid #ddd;
    padding: 20px;
    border-radius: 15px;
    cursor: pointer;
}

.class-card:hover {
    border-color: #006cff;
    background: #f2f8ff;
}


/* ================= CALCULATE BUTTON ================= */

.search-btn {
    width: 100%;
    height: 55px;
    margin-top: 30px;
    border: none;
    border-radius: 15px;

    background: linear-gradient(
        135deg,
        #006cff,
        #00b7ff
    );

    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.search-btn:hover {
    opacity: 0.95;
}


/* ================= MOBILE ================= */

@media(max-width:700px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

    .booking-page {
        padding: 20px;
    }

    .booking-header {
        gap: 15px;
        align-items: flex-start;
    }

    .booking-header h1 {
        font-size: 25px;
    }

    .booking-container {
        padding: 25px;
    }

    .back-dashboard {
        padding: 10px 14px;
        font-size: 14px;
    }

    .class-options {
        flex-direction: column;
    }

}

</style>

</head>


<body>


<div class="booking-page">


<!-- ================= BOOKING HEADER ================= -->

<header class="booking-header">

    <div>

        <h1 id="booking-title">
            Book Your <span>Journey</span> 🚆
        </h1>

        <p id="booking-subtitle">
            Namo Bharat Rapid Rail Smart Booking
        </p>

    </div>


    <!-- DASHBOARD BUTTON -->

    <div class="dashboard-option">

    <span class="dashboard-label">
        Dashboard
    </span>

    <a href="dashboard.html"
       class="back-dashboard">

        <i class="fa-solid fa-gauge-high"></i>

    </a>

</div>
</header>



<!-- ================= BOOKING CONTAINER ================= -->

<div class="booking-container">


<!-- ================= JOURNEY TITLE ================= -->

<div class="booking-title">

    <i class="fa-solid fa-ticket"></i>

    <h2 id="journey-text">
        Journey Details
    </h2>

</div>



<!-- ================= FORM ================= -->

<div class="form-grid">


<!-- FROM STATION -->

<div class="input-box">

    <label id="from-text">
        From Station
    </label>

    <select id="fromStation">

        <option>
            New Ashok Nagar
        </option>

        <option>
            Anand Vihar
        </option>

        <option>
            Sahibabad
        </option>

        <option>
            Ghaziabad
        </option>

        <option>
            Meerut
        </option>

    </select>

</div>



<!-- TO STATION -->

<div class="input-box">

    <label id="to-text">
        To Station
    </label>

    <select id="toStation">

        <option>
            Meerut
        </option>

        <option>
            Ghaziabad
        </option>

        <option>
            Sahibabad
        </option>

        <option>
            Anand Vihar
        </option>

        <option>
            New Ashok Nagar
        </option>

    </select>

</div>



<!-- DATE -->

<div class="input-box">

    <label id="date-text">
        Journey Date
    </label>

    <input
        type="date"
        id="journeyDate">

</div>



<!-- PASSENGERS -->

<div class="input-box">

    <label id="passenger-text">
        Passengers
    </label>

    <input
        type="number"
        id="passenger"
        value="1"
        min="1">

</div>


</div>



<!-- ================= CLASS ================= -->

<div class="class-box">

    <h3 id="class-text">
        Select Class
    </h3>


    <div class="class-options">


        <!-- STANDARD -->

        <label class="class-card">

            <input
                type="radio"
                name="class"
                value="40"
                checked>

            <span id="standard-text">
                Standard
            </span>

            <br>

            ₹40

        </label>



        <!-- PREMIUM -->

        <label class="class-card">

            <input
                type="radio"
                name="class"
                value="80">

            <span id="premium-text">
                Premium
            </span>

            <br>

            ₹80

        </label>


    </div>

</div>



<!-- ================= CALCULATE FARE BUTTON ================= -->

<button
    class="search-btn"
    onclick="calculateFare()">

    <span id="calculate-text">
        Calculate Fare & Continue
    </span>

    <i class="fa-solid fa-arrow-right"></i>

</button>


</div>


</div>



<!-- ================= JAVASCRIPT ================= -->

<script>

function calculateFare() {


    /* ================= GET STATIONS ================= */

    let fromStation =
        document.getElementById("fromStation").value;


    let toStation =
        document.getElementById("toStation").value;



    /* ================= SAME STATION CHECK ================= */

    if (fromStation === toStation) {

        alert(
            "From Station and To Station cannot be the same."
        );

        return;

    }



    /* ================= JOURNEY DATE ================= */

    let journeyDate =
        document.getElementById("journeyDate").value;


    if (!journeyDate) {

        alert(
            "Please select your journey date."
        );

        return;

    }



    /* ================= PASSENGERS ================= */

    let passenger =
        parseInt(
            document.getElementById("passenger").value
        );


    if (passenger < 1) {

        alert(
            "Please select at least 1 passenger."
        );

        return;

    }



    /* ================= SELECTED CLASS ================= */

    let selectedClass =
        document.querySelector(
            'input[name="class"]:checked'
        );


    let classFare =
        parseInt(selectedClass.value);



    let className =
        selectedClass.parentElement.innerText
            .split("\n")[0]
            .trim();



    /* ================= CALCULATE FARE ================= */

    let total =
        passenger * classFare;



    /* ================= SAVE BOOKING DATA ================= */

    let ticketId =
        "NBR" +
        Math.floor(
            100000 +
            Math.random() * 900000
        );


    localStorage.setItem(
        "ticketId",
        ticketId
    );


    localStorage.setItem(
        "bookingFrom",
        fromStation
    );


    localStorage.setItem(
        "bookingTo",
        toStation
    );


    localStorage.setItem(
        "bookingDate",
        journeyDate
    );


    localStorage.setItem(
        "bookingPassengers",
        passenger
    );


    localStorage.setItem(
        "bookingClass",
        className
    );


    localStorage.setItem(
        "bookingFare",
        total
    );



    /* ================= TICKET COUNT ================= */

    let oldTickets =
        parseInt(
            localStorage.getItem(
                "totalTickets"
            ) || "0"
        );


    localStorage.setItem(
        "totalTickets",
        oldTickets + 1
    );



    /* ================= JOURNEY COUNT ================= */

    let oldJourneys =
        parseInt(
            localStorage.getItem(
                "totalJourneys"
            ) || "0"
        );


    localStorage.setItem(
        "totalJourneys",
        oldJourneys + 1
    );



    /* ================= SHOW SUCCESS ================= */

    alert(
        "Booking Details Saved Successfully!"
    );

}

</script>


<!-- LANGUAGE SCRIPT -->

<script src="JS/language.js"></script>


</body>

</html>
