<style>


.booking-page{

.booking-title{

<script>

function calculateFare() {

    // Get From Station

    let fromStation =
        document.getElementById("fromStation").value;


    // Get To Station

    let toStation =
        document.getElementById("toStation").value;


    // Get Journey Date

    let journeyDate =
        document.getElementById("journeyDate").value;


    // Get Passenger Count

    let passenger =
        parseInt(
            document.getElementById("passenger").value
        );


    // Get Selected Class

    let selectedClass =
        document.querySelector(
            'input[name="class"]:checked'
        );


    let classFare =
        parseInt(selectedClass.value);


    let className =
        selectedClass.parentElement.innerText
            .split("\n")[0]
            .trim();


    // Calculate Fare

    let total =
        passenger * classFare;


    // Show Fare

    document.getElementById("fare")
        .innerHTML =
        "₹" + total;



    // Generate Ticket ID

    let ticketId =
        "NBR" +
        Math.floor(
            100000 + Math.random() * 900000
        );



    // Save Booking Data

    localStorage.setItem(
        "ticketId",
        ticketId
    );


    localStorage.setItem(
        "bookingFrom",
        fromStation
    );


    localStorage.setItem(
        "bookingTo",
        toStation
    );


    localStorage.setItem(
        "bookingDate",
        journeyDate
    );


    localStorage.setItem(
        "bookingPassengers",
        passenger
    );


    localStorage.setItem(
        "bookingClass",
        className
    );


    localStorage.setItem(
        "bookingFare",
        total
    );



    // Ticket Count

    let oldTickets =
        parseInt(
            localStorage.getItem("totalTickets") || "0"
        );


    localStorage.setItem(
        "totalTickets",
        oldTickets + 1
    );



    // Journey Count

    let oldJourneys =
        parseInt(
            localStorage.getItem("totalJourneys") || "0"
        );


    localStorage.setItem(
        "totalJourneys",
        oldJourneys + 1
    );



    // Success Message

    alert(
        "Booking Details Saved Successfully!"
    );


}

</script>
